<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="CTS payroll system interface">
  <title>CTS Payroll System — Payroll Operations</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#content">Skip to main content</a>
  <button class="nav-backdrop" id="navBackdrop" aria-label="Close navigation" tabindex="-1" hidden></button>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
      <button class="icon-btn sidebar-close" id="closeNavBtn" aria-label="Collapse sidebar" title="Collapse sidebar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 7-5 5 5 5"/></svg></button>
      <div class="brand"><div class="brand-logo-frame"><img class="brand-logo" src="cts-logo-outlined.png" alt="CTS logo"></div><span class="brand-sub">Payroll<br>system</span></div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot"><div class="user"><div class="avatar">RA</div><div><strong>Reg A.</strong><small>Payroll administrator</small></div></div></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="top-left">
          <button class="icon-btn sidebar-toggle" id="menuBtn" aria-label="Collapse sidebar" title="Collapse sidebar" aria-controls="sidebar" aria-expanded="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 7-5 5 5 5"/></svg></button>
          <div class="payroll-period"><span class="period-heading">Current payroll period</span><div class="period-details"><div class="period-cutoff"><strong>06–20 Aug 2026</strong><span class="cutoff-badge">EOM</span></div><div class="period-paydate"><span>Pay date</span><strong><time datetime="2026-08-31">31 Aug 2026</time></strong></div></div></div>
        </div>
        <div class="top-actions"><button class="icon-btn" data-action="notify" aria-label="Notifications">♢<span class="dot"></span></button><button class="icon-btn" data-action="help" aria-label="Help">?</button></div>
      </header>
      <div class="content" id="content" tabindex="-1"></div>
    </main>
  </div>
  <div class="notice" id="notice" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">Enable JavaScript to view the payroll workspace.</p></noscript>
  <script src="app.js" defer></script>
</body>
</html>
