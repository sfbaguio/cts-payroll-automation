    const svg=(name)=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${iconPaths[name]||iconPaths.file}" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    const groups=[
      ['Payroll',[['dashboard','Dashboard',''],['upload','Timesheet import',''],['alert','Exception queue','Phase 2',true,'Phase 2 — not available in the V1 mockup'],['play','Payroll run',''],['table','Payroll register',''],['calculator','13th-month pay','Manual'],['check','Run approval','Phase 2',true,'Phase 2 — not available in the V1 mockup'],['file','Payslip release','']]],

    function timesheets(){const rows=[['2,841','Mara Santos','CTS-0104','06–20 Aug','176.0 h','Matched'],['2,842','Paolo Reyes','CTS-0089','06–20 Aug','168.0 h','Matched'],['2,843','Nina Garcia','CTS-0121','06–20 Aug','92.5 h','Matched'],['2,844','J. Dela Cruz','—','06–20 Aug','80.0 h','Unmatched'],['2,845','Carlo Mendoza','CTS-0048','06–20 Aug','184.0 h','Matched'],['2,846','M. Santos','—','06–20 Aug','8.0 h','Duplicate']];return head('Timesheet import','Bring attendance into the cut-off in one controlled step. Original TCW values remain intact for audit.',button('Pull automatically','','auto-pull')+button('Commit import','teal','commit-import'))+`<div class="split"><section class="card panel"><div class="upload"><div class="upload-icon">${svg('upload')}</div><h3>Drop TCW attendance here</h3><p>CSV or Excel · one file for all client accounts · maximum 25 MB</p>${button('Choose file','','choose')}</div></section><aside class="card panel"><div class="card-title">Cut-off assignment</div><div class="card-sub">Applied to every valid imported row</div><div style="height:14px"></div><div class="field"><label>Cut-off period</label><select><option>06–20 Aug 2026</option></select></div><div style="height:12px"></div><div class="field"><label>Client account</label><select><option>All accounts</option><option>Future Analytics</option></select></div><div style="height:12px"></div><label style="font-size:11px;color:var(--ink-2)"><input type="checkbox"> Overwrite existing rows</label></aside></div><div style="height:16px"></div><div class="grid kpis"><div class="card kpi"><div class="kpi-top">Rows read</div><div class="kpi-value">2,846</div><div class="kpi-foot">One cut-off export</div></div><div class="card kpi"><div class="kpi-top">Matched</div><div class="kpi-value">2,842</div><div class="kpi-foot"><span class="delta">99.9%</span> assigned</div></div><div class="card kpi"><div class="kpi-top">Unmatched</div><div class="kpi-value">2</div><div class="kpi-foot"><span class="delta down">Action required</span></div></div><div class="card kpi"><div class="kpi-top">Duplicates</div><div class="kpi-value">2</div><div class="kpi-foot">Held from commit</div></div></div><section class="card panel"><div class="tabs"><button class="tab active">All rows</button><button class="tab">Unmatched <span class="pill red">2</span></button><button class="tab">Matched</button><button class="tab">Duplicates <span class="pill amber">2</span></button></div><div class="table-wrap"><table><thead><tr><th>Row</th><th>Employee</th><th>Employee ID</th><th>Cut-off</th><th>Total hours</th><th>Match</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td class="money">${r[0]}</td><td><strong>${r[1]}</strong></td><td class="money">${r[2]}</td><td>${r[3]}</td><td class="money">${r[4]}</td><td><span class="pill ${r[5]==='Matched'?'green':r[5]==='Duplicate'?'amber':'red'}">${r[5]}</span></td><td><button class="text-link" data-action="import-row">Open →</button></td></tr>`).join('')}</tbody></table></div></section>`}

    function updateThirteenth(){const base=Math.max(0,Number(document.getElementById('thirteenthBase')?.value)||0);const other=Math.max(0,Number(document.getElementById('thirteenthOther')?.value)||0);const total=base/12;const combined=total+other;const taxable=Math.max(0,combined-90000);document.getElementById('thirteenthTotal').textContent=peso(total);document.getElementById('thirteenthFormula').textContent=`${peso(base)} ÷ 12`;document.getElementById('thirteenthCeiling').textContent=peso(90000);document.getElementById('thirteenthTaxable').textContent=peso(taxable);document.getElementById('thirteenthCombined').textContent=peso(combined);return{total,taxable}}

    function rulebook(){return head('Rule book','Workbook-derived calculation logic for the mockup, with regulatory tables clearly parked for later verification.',button('+ New rule version','teal','new-rule'))+`<div class="source-banner"><div class="source-mark">X</div><div><strong>Mockup source of truth · 2026 SAMPLE_NEW.xlsx</strong><p>The client-provided workbook is followed as supplied. Verification flags are reminders for production discovery and do not change the current mockup calculation.</p></div></div><div class="toolbar"><div class="filters"><button class="btn primary">Workbook rules</button><button class="btn">Statutory tables</button><button class="btn">CTS policy</button></div><span class="pill blue">Reference snapshot</span></div><div class="rule-grid">${rules.map((r,i)=>`<article class="rule-card ${r[4]?'flagged':''}">${r[4]?'<span class="pill amber">Future verification</span>':'<span class="pill green">Workbook confirmed</span>'}<div class="rule-icon">${svg(i<1?'clock':i<5?'table':'book')}</div><h3>${r[0]}</h3><p>${r[1]}</p><div class="rule-meta"><span>${r[2]}</span><strong>${r[3]}</strong></div></article>`).join('')}</div><div style="height:16px"></div><section class="card panel"><div class="card-head"><div><div class="card-title">Workbook calculation flow</div><div class="card-sub">The behavior represented in the mockup</div></div><span class="pill green">15th + EOM</span></div><div class="formula-list"><div class="formula-line">Hourly rate = ((Monthly rate × 12) ÷ 260) ÷ 8</div><div class="formula-line">Gross income = Basic hours amount + Total other income</div><div class="formula-line">Net taxable income = Gross income − SSS − HDMF − PhilHealth</div><div class="formula-line">15th tax = Semi-monthly withholding lookup</div><div class="formula-line">EOM tax = Monthly tax on both cutoffs − Tax withheld on the 15th</div><div class="formula-line">13th-month minimum = Total basic salary earned in the calendar year ÷ 12</div><div class="formula-line">Net pay = Sub total + Total non-tax income / deductions</div></div><div class="verification-list"><div class="verification-item"><div><strong>Regulatory tables</strong><small>SSS, BIR withholding tax, PhilHealth and HDMF/Pag-IBIG</small></div><span class="pill amber">Verify for production</span></div><div class="verification-item"><div><strong>13th-month salary base and tax ceiling</strong><small>Confirm employee coverage, CTS policy inclusions and current BIR exemption threshold each year.</small></div><span class="pill amber">Verify annually</span></div><div class="verification-item"><div><strong>Labor premiums and rounding</strong><small>Holiday, rest-day, OT, ND stacking and cutoff precision</small></div><span class="pill amber">Verify for production</span></div></div></section>`}
    function holidays(){const months=['January','February','March','April','May','June','July','August','September','October','November','December'];return head('Holiday calendar','Payroll day types, local scope and source proclamations in one reviewed annual calendar.',button('+ Add holiday','teal','holiday'))+`<div class="toolbar"><div class="filters"><select class="select"><option>2026</option><option>2027</option></select><select class="select"><option>Nationwide + all locations</option></select></div><div class="filters"><span class="pill red">Regular</span><span class="pill amber">Special non-working</span><span class="pill blue">Special working</span></div></div><section class="card panel"><div class="alert-box"><span>i</span><div><strong>2026 calendar reviewed by CTS</strong><p>18 entries · source references complete · changes in a closed payroll period are blocked.</p></div></div><div style="height:16px"></div><div class="calendar">${months.map((m,i)=>`<div class="month"><h3>${m}</h3><div class="dots">${[0,3,4,5,7,10,11].includes(i)?`<i class="holiday-dot"></i>${[3,7,11].includes(i)?'<i class="holiday-dot special"></i>':''}`:'<span class="muted" style="font-size:9px">No holidays</span>'}</div></div>`).join('')}</div></section>`}
    const otRows=[['Mara Santos','04 Sep 2026','2.0 h','Clock data matched','Pending'],['Paolo Reyes','03 Sep 2026','1.5 h','Clock data matched','Pending'],['Nina Garcia','01 Sep 2026','3.0 h','15 min difference','Review'],['Carlo Mendoza','29 Aug 2026','2.5 h','Clock data matched','Approved']];
    function overtime(){return head('Overtime approvals','Supervisor queue restricted to assigned employees, with clock validation beside every request.',button('Send reminder','','remind'))+`<div class="alert-box"><span>i</span><div><strong>Approval model awaiting CTS decision</strong><p>This prototype follows employee submission followed by leader approval; notification volume remains configurable.</p></div></div><div style="height:16px"></div><section class="card panel"><div class="toolbar"><div class="filters"><input class="search" placeholder="Search employee"><select class="select"><option>Pending decisions</option><option>All status</option></select></div><span class="muted">12 requests · own team only</span></div><div class="table-wrap"><table><thead><tr><th>Employee</th><th>Work date</th><th>Claimed</th><th>Clock validation</th><th>Status</th><th></th></tr></thead><tbody>${otRows.map(r=>`<tr><td><strong>${r[0]}</strong></td><td>${r[1]}</td><td class="money">${r[2]}</td><td>${r[3]}</td><td><span class="pill ${r[4]==='Approved'?'green':r[4]==='Review'?'red':'amber'}">${r[4]}</span></td><td><button class="text-link" data-action="review-ot">Review →</button></td></tr>`).join('')}</tbody></table></div></section>`}
    function unfiledOvertime(){const rows=[['Mara Santos','02 Sep','Scheduled 8.0 h','Worked 9.5 h','1.5 h'],['Paolo Reyes','31 Aug','Scheduled 8.0 h','Worked 9.1 h','1.1 h'],['Nina Garcia','29 Aug','Scheduled 4.0 h','Worked 6.8 h','2.8 h'],['Carlo Mendoza','27 Aug','Scheduled 8.0 h','Worked 10.0 h','2.0 h']];return head('Unfiled overtime','Work beyond schedule with no submitted request, surfaced for a deliberate HR decision.',button('Request approvals','teal','bulk-request'))+`<div class="toolbar"><div class="filters"><select class="select"><option>06–20 Aug 2026</option></select><select class="select"><option>All client accounts</option></select><input class="search" placeholder="Search employee"></div><span class="pill red">8 flagged shifts</span></div><section class="card table-card"><div class="table-wrap"><table><thead><tr><th>Employee</th><th>Work date</th><th>Expected</th><th>Clock data</th><th>Unfiled</th><th>HR decision</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td><strong>${r[0]}</strong></td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td class="money">${r[4]}</td><td><span class="pill amber">Awaiting review</span></td><td><button class="text-link" data-action="unfiled-review">Review →</button></td></tr>`).join('')}</tbody></table></div></section>`}
    function overtimeSubmission(){return head('Submit overtime','Employee self-service · file overtime against a specific work date and shift.',button('Submit request','teal','submit-ot'))+`<div class="split"><section class="card panel"><div class="form-grid"><div class="field"><label>Work date</label><input type="date" value="2026-09-04"></div><div class="field"><label>Shift</label><select><option>10:00 PM – 7:00 AM</option></select></div><div class="field"><label>Overtime start</label><input type="time" value="07:00"></div><div class="field"><label>Overtime end</label><input type="time" value="09:00"></div><div class="field" style="grid-column:1/-1"><label>Reason</label><input value="Month-end processing support"></div></div><div style="height:16px"></div><div class="alert-box"><span>i</span><div><strong>Clock data found</strong><p>TCW shows work continuing until 9:04 AM. Your 2-hour request can be validated automatically.</p></div></div></section><aside class="card panel"><div class="profile-head"><div class="profile-avatar">MS</div><div><h2>Mara Santos</h2><p>CTS-0104 · Future Analytics</p></div></div><div style="height:14px"></div><div class="summary-row"><span>Requests this cut-off</span><strong>2</strong></div><div class="summary-row"><span>Approved hours</span><strong>1.5 h</strong></div><div class="summary-row"><span>Pending hours</span><strong>2.0 h</strong></div></aside></div>`}
    function payslipHistory(){const rows=[['15 Aug 2026','01–20 Aug 2026','₱30,742.18','Delivered'],['30 Jul 2026','06–20 Jul 2026','₱29,998.45','Delivered'],['15 Jul 2026','21 Jun–05 Jul 2026','₱31,402.72','Delivered'],['30 Jun 2026','06–20 Jun 2026','₱29,710.20','Delivered']];return head('My payslips','Employee self-service · secure access to your own released payslip history.')+`<section class="card panel"><div class="profile-head"><div class="profile-avatar">MS</div><div><h2>Mara Santos</h2><p>CTS-0104 · Payslips are visible only to this employee</p></div></div><div style="height:16px"></div><div class="table-wrap"><table><thead><tr><th>Pay date</th><th>Cut-off</th><th>Net pay</th><th>Delivery</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td><strong>${r[0]}</strong></td><td>${r[1]}</td><td class="money">${r[2]}</td><td><span class="pill green">${r[3]}</span></td><td><button class="text-link" data-action="download-payslip">View payslip →</button></td></tr>`).join('')}</tbody></table></div></section>`}
    function reports(){return head('Reports & outputs','Payroll cost, statutory remittance, audit evidence and payment outputs built from the approved run.',button('Export report pack','teal','export-pack'))+`<div class="rule-grid">${[['Payroll cost','Cut-off, month and client account analysis','chart'],['Statutory remittance','SSS, PhilHealth, Pag-IBIG and BIR outputs','table'],['Disbursement file','Bank-ready payment output · format to confirm','file'],['Variance report','Current vs previous cut-off, with explanations','chart'],['Audit trail','Access, corrections, rule versions and approvals','book'],['Payslip delivery','Per-employee send status and retry history','check']].map(r=>`<article class="rule-card"><div class="rule-icon">${svg(r[2])}</div><h3>${r[0]}</h3><p>${r[1]}</p><button class="text-link" data-action="open-report">Open report →</button></article>`).join('')}</div>`}
    function admin(){return head('Admin','Manage users, roles, client-account access and the audit trail without exposing payroll data unnecessarily.',button('+ Invite user','teal','invite-user'))+`<div class="split"><section class="card panel"><div class="tabs"><button class="tab active">Users & roles</button><button class="tab">Client accounts</button><button class="tab">Audit log</button></div><div class="table-wrap"><table><thead><tr><th>User</th><th>Role</th><th>Client scope</th><th>Status</th><th></th></tr></thead><tbody><tr><td><strong>Reg A.</strong><div class="muted">reg@cts.example</div></td><td>Payroll administrator</td><td>All accounts</td><td><span class="pill green">Active</span></td><td><button class="text-link" data-action="permissions">Permissions</button></td></tr><tr><td><strong>Emma C.</strong><div class="muted">emma@cts.example</div></td><td>Payroll approver</td><td>All accounts</td><td><span class="pill green">Active</span></td><td><button class="text-link" data-action="permissions">Permissions</button></td></tr><tr><td><strong>Supervisor Demo</strong><div class="muted">supervisor@cts.example</div></td><td>Supervisor</td><td>Future Analytics</td><td><span class="pill green">Active</span></td><td><button class="text-link" data-action="permissions">Permissions</button></td></tr></tbody></table></div></section><aside class="card panel"><div class="card-title">Recent audit activity</div><div class="card-sub">Access and configuration changes</div><div style="height:13px"></div><div class="audit-list"><div class="audit-item"><div class="mark">R</div><div><strong>Rule version activated</strong><small>Reg A. · v2026.09</small></div><span class="muted">Yesterday</span></div><div class="audit-item"><div class="mark">U</div><div><strong>User scope changed</strong><small>Emma C. · supervisor account</small></div><span class="muted">2 days</span></div><div class="audit-item"><div class="mark">A</div><div><strong>Payroll register viewed</strong><small>Emma C. · 124 records</small></div><span class="muted">3 days</span></div></div></aside></div>`}
    const pages={'Dashboard':overview,'Timesheet import':timesheets,'Exception queue':exceptions,'Payroll run':payrollRun,'Payroll register':register,'13th-month pay':thirteenthMonth,'Run approval':approvals,'Payslip release':payslips,'Employee list':employeesPage,'Employee record':employeeRecord,'Shift schedule':shiftSchedule,'Leave requests':leaveRequests,'Rule book':rulebook,'Holiday calendar':holidays,'Reports':reports,'Admin':admin};
    const phaseOnePages=new Set(['Dashboard','Timesheet import','Payroll run','Payroll register','13th-month pay','Payslip release','Rule book','Holiday calendar']);
    function render(){renderNav();content.innerHTML=pages[active]();if(active==='Payroll register'){const nextButton=content.querySelector('[data-action="submit-approval"]');if(nextButton){nextButton.textContent='Continue to payslips';nextButton.removeAttribute('data-action');nextButton.dataset.page='Payslip release'}}if(active==='Payslip release'){const releaseButton=content.querySelector('[data-action="release"]');if(releaseButton)releaseButton.textContent='Generate & email 124 payslips';const intro=content.querySelector('.page-head p');if(intro)intro.textContent='Generate employee payslips from the computed results and automatically send them by email.';const deliveryNote=[...content.querySelectorAll('.card-sub')].find(el=>el.textContent.includes('release blocked'));if(deliveryNote)deliveryNote.textContent=`${payslipCutoff} cut-off · ready for automatic email delivery`}document.title=`${active} · CTS OS`;window.scrollTo({top:0,behavior:'smooth'})}
    function toast(title,detail='Prototype interaction — no live data was changed.'){const n=document.getElementById('notice');n.innerHTML=`<strong>${title}</strong><small>${detail}</small>`;n.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>n.classList.remove('show'),2800)}
    document.addEventListener('click',e=>{const p=e.target.closest('[data-page]');if(p){if(!phaseOnePages.has(p.dataset.page))return;active=p.dataset.page;render();document.getElementById('sidebar').classList.remove('open');return}const a=e.target.closest('[data-action]');if(!a)return;const action=a.dataset.action;if(action==='go-run'){active='Payroll run';render()}else if(action==='profile'){selectedEmployee=a.dataset.employee||selectedEmployee;active='Employee record';render()}else if(action==='payslip-15th'){payslipCutoff='15th';render()}else if(action==='payslip-eom'){payslipCutoff='EOM';render()}else if(action==='calculate-13th'){const result=updateThirteenth();toast('13th-month pay recalculated',`${peso(result.total)} calculated from the reviewed salary base.`)}else if(action==='save-13th'){const reviewed=document.getElementById('thirteenthReviewed');if(!reviewed?.checked){toast('Review confirmation required','Confirm the salary base and employee coverage before adding this manual entry.')}else{const result=updateThirteenth();toast('Manual entry ready for December payroll',`${peso(result.total)} prepared; no live payroll data was changed.`)}}else if(action==='notify')toast('V1 processing status','Timesheet upload, computation and email delivery are on track.');else if(action==='help')toast('Client walkthrough mode','Follow the active V1 pages from timesheet upload through automated payslip email.');else toast(a.textContent.trim()||'Action selected')});
    document.getElementById('menuBtn').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));
    render();
  </script>
